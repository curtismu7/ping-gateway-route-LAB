# OrbStack:  HOST_PORT=5050 docker compose up --build -d   ->  http://127.0.0.1:5050
# The server binds 0.0.0.0 INSIDE the container (LAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 5050-5099.
name: ping-gateway-route-lab

services:
  ping-gateway-route-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-5050}:5050"
    environment:
      SHELF_URL: ${SHELF_URL:-}
      PORT: "5050"
      LAB_BIND: 0.0.0.0
      # Asserts that the port above is published on 127.0.0.1 only (a test pins both). Live stays off in the container anyway:
      # it has no settings file and cannot reach a gateway on the host's loopback (README, "Mock and live modes").
      LAB_DOCKER_LOOPBACK_PUBLISH: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
